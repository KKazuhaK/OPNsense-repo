name: Deploy signed GitHub Pages repository

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Validate generated site
        run: |
          test -f index.html
          test -f kazuha.pub
          test -f repo/FreeBSD:15:amd64/meta.conf
          test -f repo/FreeBSD:15:amd64/packagesite.pkg
          test -f repo/FreeBSD:15:amd64/data.pkg
          test "$(sha256sum kazuha.pub | cut -d ' ' -f 1)" = "92e83cb0267c3ef27cb355bc2f045c3449fd5c741d1030c7a90c879b00fa5e9b"
          if find . -type f -not -path './.git/*' | grep -E '\.(key|pem)$|/(AGENTS|CLAUDE|HANDOFF|MEMORY)\.md$'; then exit 1; fi
          if grep -R --exclude-dir=.git -l -E -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' .; then exit 1; fi
      - name: Verify catalog signatures and package digest
        run: python3 verify-repo.py .
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html kazuha.pub kazuha.conf opnwall.conf SHA256SUMS.txt _site/
          cp -RL repo _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
