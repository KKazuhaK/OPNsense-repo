# Transparent proxy with the router's existing DNS integration unchanged.
mixed-port: 7890
socks-port: 7891
allow-lan: false
bind-address: 127.0.0.1
tun:
  enable: true
  stack: gvisor
  mtu: 1420
  auto-route: false
  strict-route: false
  auto-detect-interface: true
  dns-hijack: []
dns:
  enable: false
  enhanced-mode: normal
  listen: ''
