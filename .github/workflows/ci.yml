name: Validate Mihomo source
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify routing transitions and failure cases
        run: python -m unittest discover -s src/os-mihomo/tests -v
      - name: Check PHP syntax
        run: find src/os-mihomo/src -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Check shell scripts
        run: |
          shellcheck build-repo.sh publish-repo.sh src/os-mihomo/build.sh src/os-mihomo/packaging/freebsd/+PRE_INSTALL src/os-mihomo/packaging/freebsd/+POST_INSTALL src/os-mihomo/packaging/freebsd/+PRE_DEINSTALL src/os-mihomo/packaging/freebsd/+POST_DEINSTALL
          sh -n src/os-mihomo/src/usr/local/etc/rc.d/mihomo
