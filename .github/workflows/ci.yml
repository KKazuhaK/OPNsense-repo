name: Validate plugin source
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify routing transitions and failure cases
        run: |
          python -m unittest discover -s src/os-mihomo/tests -v
          python -m unittest discover -s src/os-sing-box/tests -v
          python -m unittest discover -s src/os-kazuha-repo/tests -v
          python -m unittest discover -s tests -v
      - name: Verify migrated MVC plugin backends
        run: |
          python -B -m unittest discover -s src/os-speedtest/tests -v
          python -B -m unittest discover -s src/os-lucky/tests -v
          python -B -m unittest discover -s src/os-ddns-go/tests -v
          python -B -m unittest discover -s src/os-easytier/tests/native -v
          python -B -m unittest discover -s src/os-ttyd/tests/native -v
          python -B -m unittest discover -s src/os-lang/tests/native -p test_archive.py -v
          # These two default to the installed controller tree; on a runner
          # there is none, so point them at the source they are checking.
          php src/os-speedtest/tests/native/test-api.php \
            src/os-speedtest/src/usr/local/opnsense/mvc/app/controllers/OPNsense/Speedtest/Api
          php src/os-sing-box/tests/native/test-api-contract.php \
            src/os-sing-box/src/usr/local/opnsense/mvc/app/controllers/OPNsense/SingBox/Api
          php tests/native/test-utility-api-contract.php
          php tests/native/test-small-api-contract.php
          php src/os-staticarp/tests/native/test-settings.php
      - name: Check PHP syntax
        run: find src -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n 1 php -l
      - name: Check shell scripts
        run: |
          for plugin in staticarp pftop lucky easytier ddns-go lang ttyd speedtest sing-box; do
            sh -n "src/os-$plugin/build.sh"
            for phase in PRE_INSTALL POST_INSTALL PRE_DEINSTALL POST_DEINSTALL; do
              hook="src/os-$plugin/packaging/freebsd/+$phase"
              if [ -f "$hook" ]; then sh -n "$hook"; fi
            done
          done
          shellcheck src/os-mihomo/packaging/prepare-builder.sh
          shellcheck build-repo.sh publish-repo.sh src/os-mihomo/build.sh src/os-mihomo/packaging/freebsd/+PRE_INSTALL src/os-mihomo/packaging/freebsd/+POST_INSTALL src/os-mihomo/packaging/freebsd/+PRE_DEINSTALL src/os-mihomo/packaging/freebsd/+POST_DEINSTALL src/os-mihomo/tests/jail/run.sh src/os-mihomo/tests/jail/prepare.sh src/os-sing-box/build.sh src/os-sing-box/src/usr/local/etc/sing-box/sub/sub.sh
          sh -n src/os-mihomo/src/usr/local/etc/rc.d/mihomo
          shellcheck client.sh src/os-kazuha-repo/build.sh src/os-kazuha-repo/src/usr/local/opnsense/scripts/firmware/repos/kazuha.sh src/os-kazuha-repo/packaging/freebsd/+POST_INSTALL src/os-kazuha-repo/packaging/freebsd/+POST_DEINSTALL
