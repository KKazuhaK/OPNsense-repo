# Transparent proxy with Mihomo DNS; activation still requires explicit approval.
external-controller: 127.0.0.1:9090
mixed-port: 7890
socks-port: 7891
allow-lan: false
bind-address: 127.0.0.1
tun:
  enable: true
  stack: gvisor
  mtu: 1420
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack: [any:53, "tcp://any:53"]
dns:
  enable: true
  enhanced-mode: fake-ip
  listen: 127.0.0.1:1053
